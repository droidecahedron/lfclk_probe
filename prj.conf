CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Deferred because the software-gated measurement variant puts log calls in gate window.

# rtc130 and timer130 are read through the counter API. Both nrfx counter
# drivers are def_bool y on their DT_HAS_* symbol
# (zephyr/drivers/counter/Kconfig.nrfx), so enabling the nodes in the board
# overlay is enough and only the subsystem has to be asked for here.
CONFIG_COUNTER=y
